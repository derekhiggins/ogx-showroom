apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: praxis-mvp
  namespace: openshift-ingress
  annotations: {security.opendatahub.io/authorino-tls-bootstrap: "true"}
spec:
  gatewayClassName: data-science-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: grid-system}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: praxis-mvp
  namespace: openshift-ingress
  annotations: {haproxy.router.openshift.io/timeout: 600s}
spec:
  to: {kind: Service, name: praxis-mvp-data-science-gateway-class}
  port: {targetPort: 80}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: praxis-mvp, namespace: grid-system}
spec:
  parentRefs: [{name: praxis-mvp, namespace: openshift-ingress}]
  rules:
    # Canonicalize inference paths before conditional model entitlement checks.
    - matches:
        - {method: POST, path: {type: Exact, value: /v1/responses}}
        - {method: POST, path: {type: Exact, value: /v1/responses/}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /v1/responses}
      backendRefs: [{name: consumer-gateway, port: 8080}]
      timeouts: {request: 600s, backendRequest: 600s}
    - matches:
        - {method: POST, path: {type: Exact, value: /v1/chat/completions}}
        - {method: POST, path: {type: Exact, value: /v1/chat/completions/}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /v1/chat/completions}
      backendRefs: [{name: consumer-gateway, port: 8080}]
      timeouts: {request: 600s, backendRequest: 600s}
    - matches:
        - {method: GET, path: {type: PathPrefix, value: /v1/responses}}
        - {method: DELETE, path: {type: PathPrefix, value: /v1/responses}}
        - {path: {type: PathPrefix, value: /v1/files}}
        - {path: {type: PathPrefix, value: /v1/vector_stores}}
        - {path: {type: PathPrefix, value: /v1/models}}
        - {path: {type: PathPrefix, value: /v1/prompts}}
        - {path: {type: PathPrefix, value: /v1/embeddings}}
        - {path: {type: PathPrefix, value: /v1/conversations}}
      backendRefs: [{name: consumer-gateway, port: 8080}]
      timeouts: {request: 600s, backendRequest: 600s}
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata: {name: praxis-mvp, namespace: grid-system}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: praxis-mvp}
  rules:
    authentication:
      api-key:
        plain: {selector: request.headers.authorization}
        when:
          - {selector: request.headers.authorization, operator: matches, value: "^Bearer sk-oai-.*"}
    metadata:
      apiKeyValidation:
        priority: 0
        http:
          url: https://maas-api.redhat-ai-gateway-infra.svc.cluster.local:8443/internal/v1/api-keys/validate
          method: POST
          contentType: application/json
          body:
            expression: '{"key": auth.identity.replace("Bearer ", "")}'
      subscriptionInfo:
        priority: 1
        when:
          - predicate: has(auth.metadata.apiKeyValidation.valid) && auth.metadata.apiKeyValidation.valid == true
        http:
          url: https://maas-api.redhat-ai-gateway-infra.svc.cluster.local:8443/internal/v1/subscriptions/select
          method: POST
          contentType: application/json
          body:
            expression: |
              {
                "username": auth.metadata.apiKeyValidation.username,
                "groups": has(auth.metadata.apiKeyValidation.groups) ? auth.metadata.apiKeyValidation.groups : [],
                "requestedSubscription": auth.metadata.apiKeyValidation.subscription
              }
    authorization:
      auth-valid:
        opa:
          rego: |
            allow {
              input.auth.metadata.apiKeyValidation.valid == true
              input.auth.metadata.apiKeyValidation.tenant != ""
              input.auth.metadata.apiKeyValidation.subscription != ""
              input.auth.metadata.apiKeyValidation.username != ""
            }
      subscription-valid:
        opa:
          rego: |
            allow {
              info := input.auth.metadata.subscriptionInfo
              info.name == input.auth.metadata.apiKeyValidation.subscription
              info.namespace == input.auth.metadata.apiKeyValidation.tenant
              object.get(info, "error", "") == ""
              phase := object.get(info, "phase", "")
              any([phase == "Active", phase == "Degraded"])
              object.get(info, "deletionTimestamp", "") == ""
            }
      deny-client-identity:
        patternMatching:
          patterns:
            - predicate: '!("x-user-id" in request.headers)'
            - predicate: '!("x-tenant-id" in request.headers)'
            - predicate: '!("x-maas-username" in request.headers)'
            - predicate: '!("x-maas-owner-tenant" in request.headers)'
            - predicate: '!("x-maas-subscription-info" in request.headers)'
            - predicate: '!("x-authenticated-state-owner" in request.headers)'
    response:
      success:
        headers:
          X-MaaS-Subscription-Info:
            plain: {selector: auth.metadata.subscriptionInfo.@tostr}
          X-User-Id:
            plain: {expression: auth.metadata.apiKeyValidation.username}
          X-Tenant-Id:
            plain:
              expression: auth.metadata.apiKeyValidation.tenant + "_" + auth.metadata.apiKeyValidation.subscription
          X-MaaS-Username:
            plain: {expression: auth.metadata.apiKeyValidation.username}
          X-MaaS-Owner-Tenant:
            plain:
              expression: auth.metadata.apiKeyValidation.tenant + "_" + auth.metadata.apiKeyValidation.subscription
