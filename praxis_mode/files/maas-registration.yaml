apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata: {name: praxis-mvp-openai, namespace: models-as-a-service}
spec:
  provider: openai
  endpoint: api.openai.com
  auth:
    type: apikey
    secretRef: {name: praxis-mvp-openai}
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata: {name: praxis-mvp, namespace: models-as-a-service}
spec:
  modelName: "" # Filled from versions.yaml.
  externalProviderRefs:
    - ref: {name: praxis-mvp-openai}
      targetModel: ""
      apiFormat: openai-chat
      path: /v1/chat/completions
      weight: 1
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata: {name: praxis-mvp, namespace: models-as-a-service}
spec:
  modelRef: {kind: ExternalModel, name: praxis-mvp}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata: {name: praxis-mvp, namespace: models-as-a-service}
spec:
  owner:
    users: [] # Filled with the setup user.
  modelRefs:
    - name: praxis-mvp
      namespace: models-as-a-service
      tokenRateLimits: [{limit: 10000, window: 1m}]
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata: {name: praxis-mvp, namespace: models-as-a-service}
spec:
  subjects:
    users: []
  modelRefs: [{name: praxis-mvp, namespace: models-as-a-service}]
