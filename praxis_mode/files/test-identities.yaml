apiVersion: v1
kind: ServiceAccount
metadata: {name: __RUN__-a, namespace: grid-system}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: __RUN__-b, namespace: grid-system}
automountServiceAccountToken: false
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata: {name: __RUN__-denied, namespace: models-as-a-service}
spec:
  modelName: __RUN__-denied
  externalProviderRefs:
    - ref: {name: praxis-mvp-openai}
      targetModel: __RUN__-denied
      apiFormat: openai-chat
      path: /v1/chat/completions
      weight: 1
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata: {name: __RUN__-denied, namespace: models-as-a-service}
spec:
  modelRef: {kind: ExternalModel, name: __RUN__-denied}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata: {name: __RUN__, namespace: models-as-a-service}
spec:
  subjects:
    users:
      - system:serviceaccount:grid-system:__RUN__-a
      - system:serviceaccount:grid-system:__RUN__-b
  modelRefs:
    - {name: praxis-mvp, namespace: models-as-a-service}
    - {name: __RUN__-denied, namespace: models-as-a-service}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata: {name: __RUN__-shared, namespace: models-as-a-service}
spec:
  owner:
    users:
      - system:serviceaccount:grid-system:__RUN__-a
      - system:serviceaccount:grid-system:__RUN__-b
  modelRefs:
    - name: praxis-mvp
      namespace: models-as-a-service
      tokenRateLimits: [{limit: 10000, window: 1m}]
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata: {name: __RUN__-other, namespace: models-as-a-service}
spec:
  owner:
    users: [system:serviceaccount:grid-system:__RUN__-a]
  modelRefs:
    - name: praxis-mvp
      namespace: models-as-a-service
      tokenRateLimits: [{limit: 10000, window: 1m}]
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata: {name: __RUN__-denied, namespace: models-as-a-service}
spec:
  owner:
    users: [system:serviceaccount:grid-system:__RUN__-a]
  modelRefs:
    - name: __RUN__-denied
      namespace: models-as-a-service
      tokenRateLimits: [{limit: 10000, window: 1m}]
  priority: 10
